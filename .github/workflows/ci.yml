name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # Lint retiré : `expo lint` exige qu'eslint soit installé/committé comme
      # devDependency (sinon il tente une install interactive qui échoue en CI).
      # À réactiver après `npx expo lint` local + commit des deps eslint.
